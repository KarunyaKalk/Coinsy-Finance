services:
  - type: web
    name: coinsy-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: coinsy-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://coinsy-finance.vercel.app,https://coinsy-finance.netlify.app,http://localhost:5173

databases:
  - name: coinsy-postgres
    region: singapore
    plan: starter
    databaseName: coinsy_db
    user: coinsy_user
